<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alex Morgan – Frontend Developer</title>
    <meta name="description" content="Alex Morgan is a frontend developer building calm, accessible interfaces with React and TypeScript." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <!-- Fonts: change these two families here and in src/index.css (--font-display / --font-sans) -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Apply saved theme before paint so there's no flash. Light is the default. -->
    <script>
      try {
        if (localStorage.getItem("theme") === "dark") document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
